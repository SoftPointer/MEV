name: MEV-Eval offline tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.12"]
    defaults:
      run:
        working-directory: mev_eval
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install evaluator dependency
        run: python -m pip install -r requirements.txt
      - name: Run tests without API credentials
        env:
          GEMINI_API_KEY: ""
          GOOGLE_API_KEY: ""
        run: python -m unittest discover -s tests -v
      - name: Check launcher syntax
        run: bash -n scripts/run_mev_eval.sh
