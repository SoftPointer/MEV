name: Evaluator bug
description: Report a reproducible MEV-Eval problem.
title: "[Bug] "
body:
  - type: textarea
    id: problem
    attributes:
      label: Expected and observed behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include the command and a small record or cached response when relevant. Remove API keys and private paths.
      render: text
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Python version, OS, code revision, and judge model if applicable.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Error or log excerpt
      render: text
